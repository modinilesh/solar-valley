spring.application.name=solarvalley

server.port=${PORT:8080}

# Optional server-side email configuration.
# Values must be provided by the hosting environment; never commit real credentials.
spring.mail.host=${MAIL_HOST:smtpout.secureserver.net}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.auth=true

mail.fromMail=${MAIL_FROM:${MAIL_USERNAME}}
